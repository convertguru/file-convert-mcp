[project]
name = "file-convert-mcp"
version = "0.1.3"
readme = "README.md"
license = { text = "MIT" }
description = "MCP tool for file conversion and file format detection by Convert.Guru"
authors = []
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.14.7,<3",
    "aiohttp",
    "python-dotenv",
    "python-magic; sys_platform != 'win32'",
    "python-magic-bin==0.4.14; sys_platform == 'win32'",
    "starlette"
]

[project.urls]
Homepage = "https://convert.guru"
Repository = "https://github.com/convertguru/file-convert-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
file-convert-mcp = "file_convert_mcp.server:main"
